<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="rombelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Ring with Gold Border -->
  <circle cx="100" cy="100" r="94" fill="url(#rombelBg)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#fde047" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.8"/>

  <!-- Karang Taruna Petal Base (5 Lotus Petals) -->
  <g fill="url(#goldGrad)" opacity="0.95">
    <path d="M100 25 C108 45 116 60 100 78 C84 60 92 45 100 25 Z"/>
    <path d="M100 78 C118 68 138 72 145 92 C128 96 112 88 100 78 Z"/>
    <path d="M100 78 C82 68 62 72 55 92 C72 96 88 88 100 78 Z"/>
    <path d="M100 85 C120 95 135 115 132 135 C116 128 108 108 100 85 Z"/>
    <path d="M100 85 C80 95 65 115 68 135 C84 128 92 108 100 85 Z"/>
  </g>

  <!-- Education Open Book Icon in Center -->
  <g fill="white">
    <path d="M100 115 C90 106 72 104 56 108 L56 142 C72 138 90 140 100 148 C110 140 128 138 144 142 L144 108 C128 104 110 106 100 115 Z"/>
    <path d="M100 115 L100 148" stroke="#1e1b4b" stroke-width="2"/>
  </g>

  <!-- Flaming Torch of Knowledge in Top-Center -->
  <g filter="url(#glow)">
    <path d="M100 48 C105 58 112 66 100 78 C88 66 95 58 100 48 Z" fill="#ef4444"/>
    <path d="M100 55 C103 62 107 68 100 75 C93 68 97 62 100 55 Z" fill="#fbbf24"/>
  </g>

  <!-- Graduation Cap Silhouette in Book -->
  <polygon points="100,102 118,109 100,116 82,109" fill="url(#cyanGrad)"/>
  <rect x="91" y="112" width="18" height="5" rx="2" fill="url(#cyanGrad)"/>
  <path d="M116 110 L118 122" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Badge Text Banner at Bottom -->
  <path d="M40 156 Q100 178 160 156 Q100 186 40 156 Z" fill="url(#goldGrad)"/>
  <text x="100" y="168" font-family="Arial, sans-serif" font-weight="900" font-size="9" fill="#1e1b4b" text-anchor="middle" letter-spacing="1.5">KTCT TAMBORA</text>
  
  <!-- Tiny Stars on Top Arc -->
  <polygon points="100,16 102,20 106,20 103,23 104,27 100,24 96,27 97,23 94,20 98,20" fill="#facc15"/>
  <polygon points="80,22 81.5,25 84.5,25 82,27.5 83,30.5 80,28.5 77,30.5 78,27.5 75.5,25 78.5,25" fill="#facc15"/>
  <polygon points="120,22 121.5,25 124.5,25 122,27.5 123,30.5 120,28.5 117,30.5 118,27.5 115.5,25 118.5,25" fill="#facc15"/>
</svg>
