<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#CA8A04" />
    </radialGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
  </defs>

  <!-- Outer Pentagon (Segilima Belimbing) -->
  <polygon points="100,8 190,73 156,180 44,180 10,73" fill="url(#blueGrad)" stroke="#EAB308" stroke-width="6" stroke-linejoin="round" />
  
  <!-- Inner Pentagon Border -->
  <polygon points="100,18 178,75 148,170 52,170 22,75" fill="none" stroke="#FFFFFF" stroke-width="2.5" />

  <!-- Garis Sayap & Burung Merak Kemendikbud -->
  <!-- Sayap Kiri -->
  <path d="M100,110 C85,90 60,85 45,95 C55,108 70,115 88,118 Z" fill="#FACC15" />
  <path d="M100,118 C82,105 58,105 45,115 C58,125 75,128 92,126 Z" fill="#EAB308" />
  <path d="M100,126 C80,122 62,125 50,135 C65,142 82,138 95,133 Z" fill="#CA8A04" />

  <!-- Sayap Kanan -->
  <path d="M100,110 C115,90 140,85 155,95 C145,108 130,115 112,118 Z" fill="#FACC15" />
  <path d="M100,118 C118,105 142,105 155,115 C142,125 125,128 108,126 Z" fill="#EAB308" />
  <path d="M100,126 C120,122 138,125 150,135 C135,142 118,138 105,133 Z" fill="#CA8A04" />

  <!-- Blencong / Lampu Minyak Pendidikan (Nyala Api) -->
  <path d="M100,42 C106,55 112,65 106,75 C102,80 98,80 94,75 C88,65 94,55 100,42 Z" fill="#EF4444" stroke="#FDE047" stroke-width="1.5" />
  <path d="M100,50 C103,58 106,64 102,70 C100,73 98,73 96,70 C94,64 97,58 100,50 Z" fill="#FDE047" />

  <!-- Wadah Blencong & Buku Terbuka -->
  <path d="M88,78 L112,78 L108,90 L92,90 Z" fill="#FACC15" stroke="#78350F" stroke-width="1.5" />
  <path d="M75,92 C85,90 95,93 100,97 C105,93 115,90 125,92 L122,102 C113,100 105,103 100,107 C95,103 87,100 78,102 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ekor Tengah (5 Helai) -->
  <polygon points="100,132 94,158 106,158" fill="#FACC15" />
  <polygon points="95,134 85,155 94,156" fill="#EAB308" />
  <polygon points="105,134 115,155 106,156" fill="#EAB308" />

  <!-- Semboyan Lingkar Bawah -->
  <text x="100" y="174" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8.5" font-weight="900" fill="#FDE047" text-anchor="middle" letter-spacing="0.5">TUT WURI HANDAYANI</text>
</svg>
